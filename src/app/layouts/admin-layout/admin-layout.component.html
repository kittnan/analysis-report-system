<div class="wrapper" *ngIf="loginStatus">
    <button class="mobile-menu-toggle" type="button" (click)="toggleSidebar()" aria-label="Toggle sidebar menu">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <div class="sidebar" data-color="black" data-active-color="danger" [class.sidebar-mobile-open]="isMobileSidebarOpen" [class.sidebar-desktop-hidden]="!isMobileView && isDesktopSidebarHidden">
        <sidebar-cmp></sidebar-cmp>
    </div>

    <div class="mobile-sidebar-backdrop" *ngIf="isMobileView && isMobileSidebarOpen" (click)="closeMobileSidebar()"></div>

    <div class="main-panel" [class.main-panel-expanded]="!isMobileView && isDesktopSidebarHidden">
        <navbar-cmp></navbar-cmp>
        <div class="content">
            <!-- <h1 style="color: red;">
                TEST VERSION - 
            </h1> -->
            <router-outlet></router-outlet>
        </div>

        <footer-cmp></footer-cmp>

    </div>
</div>

<div class="wrapper" *ngIf="!loginStatus">
    <router-outlet></router-outlet>
</div>
